services:
  mysql:
    image: mysql:8.0
    container_name: mysql_web2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_marcas_prestamos
    ports:
      - "3307:3306"
    volumes:
      - mysql_web2_data:/var/lib/mysql
      - ./backend/database:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_web2
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_web2_data: